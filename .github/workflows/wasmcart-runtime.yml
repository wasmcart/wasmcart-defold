name: wasmcart runtime

# Builds the cart runtime and publishes the two engine wasms (GL, and dual GL +
# WebGPU)
# and the SDK that relinks them with native extensions. Those are the only
# artifacts this project produces: the content compiler (bob) and the builtins
# tree are upstream Defold's, so consumers take them from Defold's own archive.
# wasmcart-defold-examples downloads this engine rather than rebuilding it,
# which keeps that repo's CI to a couple of minutes.
# Triggered only by changes that can alter the binary. The build takes about
# forty minutes, and a commit touching just this file used to spend all of it
# re-emitting a byte-identical wasm: six such commits did exactly that. Edit
# the workflow and run it from the Actions tab (workflow_dispatch) to check a
# CI change without rebuilding on every push.
on:
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - 'ext/**'
      - 'share/**'
      - 'build_tools/**'
      - 'scripts/build.py'
      - 'sdk/**'
  workflow_dispatch:
  release:
    types: [published]

# The release step uploads an asset, which needs write access to contents.
# Without it the job builds fine and then fails with
# "HTTP 403: Resource not accessible by integration".
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      # The host-side libraries link against X11 and GL, and a runner has no
      # -dev packages for them: the build failed with "unable to find library
      # -lXext". This is upstream's own documented list (docs/README_SETUP.md),
      # minus the packages that no longer exist on current Ubuntu and are not
      # needed for a wasm-web build.
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            autoconf automake build-essential libtool \
            libssl-dev uuid-dev libcurl4-openssl-dev \
            libxi-dev libxext-dev libx11-xcb-dev libxrandr-dev \
            libgl1-mesa-dev libglu1-mesa-dev libopenal-dev

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # CMakeLists.txt sets cmake_minimum_required(VERSION 4.0) and the build
      # uses the Ninja generator. Runners ship cmake 3.31, so both are
      # installed explicitly rather than assumed.
      - uses: lukka/get-cmake@v4.4.2
        with:
          cmakeVersion: '4.0.3'
          ninjaVersion: 'latest'

      # cmake's FindJava has to locate a JDK. Installing one explicitly keeps
      # this independent of whatever a particular developer's tree happens to
      # contain under tmp/.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      # build.py shells out to `git remote get-url origin` and aborts without
      # one. actions/checkout leaves a remote in place, so this is a guard for
      # workflow_dispatch on a detached state rather than the normal path.
      - name: Ensure an origin remote exists
        run: git remote get-url origin || git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"

      # build.py reads these from the environment and refuses to run without
      # them. `build.py shell` sets them by spawning an interactive shell, and
      # dmenv.sh is generated rather than committed, so neither is usable from
      # a workflow: set them directly instead.
      - name: Set the Defold build environment
        run: |
          {
            echo "DEFOLD_HOME=$GITHUB_WORKSPACE"
            echo "DYNAMO_HOME=$GITHUB_WORKSPACE/tmp/dynamo_home"
            echo "PYTHONPATH=$GITHUB_WORKSPACE/tmp/dynamo_home/lib/python:$GITHUB_WORKSPACE/build_tools:$GITHUB_WORKSPACE/tmp/dynamo_home/ext/lib/python"
            echo "PYTHONIOENCODING=UTF-8"
            echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/tmp/dynamo_home/lib/wasm-web:$GITHUB_WORKSPACE/tmp/dynamo_home/ext/lib/x86_64-linux"
            echo "CMAKE_GENERATOR=Ninja"
            echo "EM_CONFIG=$GITHUB_WORKSPACE/tmp/emscripten_config"
            echo "EM_CACHE=$GITHUB_WORKSPACE/tmp/emcache"
          } >> "$GITHUB_ENV"

      # Defold's own install_sdk pulls the Emscripten SDK from DM_PACKAGES_URL,
      # one of upstream's private secrets, which this org does not have. Clone
      # emsdk and install the version Defold expects instead.
      #
      # The whole SDK has to live at ext/SDKs/emsdk-<version>, not merely be on
      # PATH: build_tools/sdk.py reads <emsdk>/node to find the node it runs
      # emscripten with, so a config pointing elsewhere fails with
      # FileNotFoundError on that directory. A local checkout symlinks the same
      # path at its own emsdk clone.
      - name: Install the Emscripten SDK
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install 4.0.6
          "$HOME/emsdk/emsdk" activate 4.0.6
          mkdir -p "$GITHUB_WORKSPACE/tmp/dynamo_home/ext/SDKs"
          ln -sfn "$HOME/emsdk" "$GITHUB_WORKSPACE/tmp/dynamo_home/ext/SDKs/emsdk-4.0.6"
          test -d "$HOME/emsdk/node" || { echo "::error::emsdk has no node/ directory; Defold needs it"; exit 1; }
          ls "$HOME/emsdk/node"

      - name: Write the Emscripten config Defold reads
        run: |
          set -euo pipefail
          mkdir -p tmp
          EM="$HOME/emsdk"
          NODE_BIN=$(ls -d "$EM"/node/*/bin/node | head -1)
          {
            echo "import os"
            echo "emsdk_path = '$EM'"
            echo "NODE_JS = '$NODE_BIN'"
            echo "LLVM_ROOT = emsdk_path + '/upstream/bin'"
            echo "BINARYEN_ROOT = emsdk_path + '/upstream'"
            echo "EMSCRIPTEN_ROOT = emsdk_path + '/upstream/emscripten'"
            echo "CACHE = '$GITHUB_WORKSPACE/tmp/emcache'"
          } > tmp/emscripten_config
          cat tmp/emscripten_config

      # The dual engine's WebGPU adapter links Dawn's emdawnwebgpu port, and must use the same
      # release the wasmcart host's WebGPU glue was generated from (wasmcart's
      # scripts/wgpu/emdawnwebgpu.json), so it is pinned and checksummed here.
      - name: Fetch the emdawnwebgpu release
        run: |
          set -euo pipefail
          REL=v20261002.154047
          SUM=6b14532b85c7f4d51154b6eeb6bd3fcf7735ad5c7cfd698d83985dd21a1c15c2
          curl -fsSL -o "$RUNNER_TEMP/emdawnwebgpu.zip" \
            "https://github.com/google/dawn/releases/download/$REL/emdawnwebgpu_pkg-$REL.zip"
          echo "$SUM  $RUNNER_TEMP/emdawnwebgpu.zip" | sha256sum -c
          unzip -q "$RUNNER_TEMP/emdawnwebgpu.zip" -d "$RUNNER_TEMP"
          echo "DEFOLD_EMDAWNWEBGPU_PORT=$RUNNER_TEMP/emdawnwebgpu_pkg/emdawnwebgpu.port.py" >> "$GITHUB_ENV"

      - name: Install external packages
        run: ./scripts/build.py --platform=wasm-web install_ext

      # install_ext unpacks the JDK and the toolchain binaries, so these can
      # only be resolved once it has run.
      - name: Add the installed toolchain to PATH
        run: |
          # JAVA_HOME comes from setup-java. Defold's own tree may also ship a
          # JDK under tmp/jdk on a developer machine; prefer that when present
          # so CI and a local checkout agree, but do not require it.
          JDK=$(ls -d "$GITHUB_WORKSPACE"/tmp/jdk/*/ 2>/dev/null | head -1)
          [ -n "$JDK" ] && echo "JAVA_HOME=${JDK%/}" >> "$GITHUB_ENV"
          {
            echo "$GITHUB_WORKSPACE/tmp/bin"
            [ -n "$JDK" ] && echo "${JDK%/}/bin"
            echo "$GITHUB_WORKSPACE/tmp/dynamo_home/bin/wasm-web"
            echo "$GITHUB_WORKSPACE/tmp/dynamo_home/bin"
            echo "$GITHUB_WORKSPACE/tmp/dynamo_home/ext/bin"
            echo "$GITHUB_WORKSPACE/tmp/dynamo_home/ext/bin/x86_64-linux"
          } >> "$GITHUB_PATH"

      # The engine links against Bullet, Box2D and the other external libraries,
      # which are built per target platform. A developer tree already has them
      # under ext/lib/wasm-web from an earlier run; a fresh checkout does not,
      # and configure fails with "Missing libBulletDynamics.a. Run
      # ./scripts/build.py --platform=wasm-web build_ext first."
      - name: Build the external libraries
        run: ./scripts/build.py --platform=wasm-web build_ext

      - name: Build the cart runtime
        run: |
          ./scripts/build.py --platform=wasm-web --skip-tests build_engine -- \
            --skip-build-tests --with-wasmcart

      # build.py has exited 0 after a fatal compile error before now, leaving a
      # stale wasm in place. Assert the artifact exists and is plausibly sized
      # rather than trusting the exit code.
      - name: Verify the engines were actually produced
        run: |
          for W in tmp/dynamo_home/bin/wasm-web/dmengine_wasmcart.wasm tmp/dynamo_home/bin/wasm-web/dmengine_wasmcart_dual.wasm; do
            test -f "$W" || { echo "no engine at $W"; exit 1; }
            SZ=$(stat -c%s "$W")
            echo "$W: $SZ bytes"
            test "$SZ" -gt 1000000 || { echo "$W is implausibly small"; exit 1; }
          done

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # The SDK is read from this build's own ninja graph, so it relinks
      # exactly what build.py just linked.
      - name: Make the SDK
        run: node sdk/make-sdk.mjs --tar

      # Prove the SDK before publishing it: relink with a one-function C++
      # extension, run the cart, require the extension's answer, and require
      # the same project to fail on an engine relinked without it. Both engines,
      # the dual one on GL only: the runner has Mesa's software GL but no
      # WebGPU device.
      - name: Test the SDK
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          EGL_PLATFORM: surfaceless
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgles2 libglvnd0 libgl1-mesa-dri libglx-mesa0 libgbm1
          # bob from the Defold release this engine is (1.14.0), not whatever
          # is newest: newer content can be unreadable to an older engine.
          BOB_SHA=a81dbb0478e8b73931dc2d671563204f6ac0ef82
          curl -fL --max-time 900 -o "$RUNNER_TEMP/bob.jar" \
            "https://d.defold.com/archive/stable/$BOB_SHA/bob/bob.jar"
          npm install --prefix "$RUNNER_TEMP/wc" --no-save --no-audit --no-fund wasmcart
          node sdk/test/run.mjs --no-webgpu --bob "$RUNNER_TEMP/bob.jar" \
            --wasmcart "$RUNNER_TEMP/wc/node_modules/wasmcart" --emsdk "$HOME/emsdk"

      # Only the engine is published: bob.jar and builtins are upstream
      # Defold's, unmodified here, and consumers get them from Defold's own
      # archive instead of a copy redistributed under this project's name.
      - name: Stage the engines and the SDK
        run: |
          mkdir -p dist
          cp tmp/dynamo_home/bin/wasm-web/dmengine_wasmcart.wasm dist/
          cp tmp/dynamo_home/bin/wasm-web/dmengine_wasmcart_dual.wasm dist/
          cp tmp/wasmcart-defold-sdk.tar.gz dist/
          (cd dist && sha256sum dmengine_wasmcart.wasm dmengine_wasmcart_dual.wasm wasmcart-defold-sdk.tar.gz > SHA256SUMS)
          du -sh dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: wasmcart-defold-engine
          path: dist/
          retention-days: 30

      # On a tagged release, attach the engine so consumers can pin a version
      # instead of chasing the latest green build. Uploaded bare: it is a
      # single 3 MB file and a tarball would only add a step to unpack it.
      # Attach the engine only when the release does not already carry one.
      # A release cut by hand ships a binary that was built and checked against
      # the examples; clobbering it here would replace the tested artifact with
      # an untested rebuild of the same commit.
      - name: Attach to the release
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" \
               --json assets --jq '.assets[].name' \
             | grep -qx 'dmengine_wasmcart.wasm'; then
            echo "release ${GITHUB_REF_NAME} already has dmengine_wasmcart.wasm; leaving it alone"
            exit 0
          fi
          gh release upload "${GITHUB_REF_NAME}" \
            dist/dmengine_wasmcart.wasm dist/dmengine_wasmcart_dual.wasm \
            dist/wasmcart-defold-sdk.tar.gz dist/SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
